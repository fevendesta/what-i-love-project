  <!-- MAIN -->
  <main class="contact-page">

    <h2>Recommend me a book</h2>
    <p>Fill in the form below and lemme know what I should read next!!</p>

    <form action="#" method="post">

      <label for="name">Your name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>

      <label for="age">Your age</label>
      <input type="number" id="age" name="age" min="5" max="100" required>

      <p class="group-title">What kind of book are you recommending?</p>
      <div class="options">
        <input type="radio" id="fiction" name="type" value="fiction" required>
        <label for="fiction">Fiction</label>

        <input type="radio" id="nonfiction" name="type" value="nonfiction">
        <label for="nonfiction">Non-fiction</label>
      </div>

      <p class="group-title">Which genres do you like?</p>
      <div class="options">
        <input type="checkbox" id="thriller" name="genre" value="thriller">
        <label for="thriller">Thriller</label>

        <input type="checkbox" id="selfhelp" name="genre" value="selfhelp">
        <label for="selfhelp">Self-help</label>

        <input type="checkbox" id="spiritual" name="genre" value="spiritual">
        <label for="spiritual">Spiritual</label>
      </div>

      <!-- Range slider: satisfaction level -->
      <label for="rating">How much do you like my bookshelf? (1 to 5)</label>
      <input type="range" id="rating" name="rating" min="1" max="5" value="3">

      <label for="message">Your message</label>
      <textarea id="message" name="message" rows="5" placeholder="Tell me about the book..." required></textarea>

      <!-- Submit button -->
      <button type="submit"><i class="fa-solid fa-paper-plane"></i> Send</button>

    </form>

  </main>
